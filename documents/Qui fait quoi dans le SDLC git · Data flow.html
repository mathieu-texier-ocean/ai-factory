<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qui fait quoi dans le SDLC git · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580;
      --accent:#bf4520; --link:#2e5aa8;
      --node-fill:#f5f5f5; --node-stroke:rgba(45,49,66,0.25);
      --focal-fill:rgba(191,69,32,0.07); --focal-chip:rgba(191,69,32,0.20);
      --chip:rgba(45,49,66,0.12); --lane:rgba(45,49,66,0.018); --rule:rgba(45,49,66,0.12); --dot:rgba(45,49,66,0.10);
      --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
      --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
      --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper:#2d3142; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#949eb2;
        --accent:#f08a59; --link:#739fdf;
        --node-fill:rgba(245,245,245,0.04); --node-stroke:rgba(245,245,245,0.20);
        --focal-fill:rgba(240,138,89,0.12); --focal-chip:rgba(240,138,89,0.22);
        --chip:rgba(245,245,245,0.12); --lane:rgba(245,245,245,0.025); --rule:rgba(245,245,245,0.12); --dot:rgba(245,245,245,0.10);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper:#2d3142; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#949eb2;
      --accent:#f08a59; --link:#739fdf;
      --node-fill:rgba(245,245,245,0.04); --node-stroke:rgba(245,245,245,0.20);
      --focal-fill:rgba(240,138,89,0.12); --focal-chip:rgba(240,138,89,0.22);
      --chip:rgba(245,245,245,0.12); --lane:rgba(245,245,245,0.025); --rule:rgba(245,245,245,0.12); --dot:rgba(245,245,245,0.10);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
    body { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; max-width: 100%; }
    svg { display: block; width: 100%; min-width: 840px; }

    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
    .arrow-label { fill: var(--accent); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }

    /* Rôles de couleur : les attributs portent la valeur claire, ces classes suivent le thème. */
    .bg { fill: var(--paper); } .dot { fill: var(--dot); } .lane { fill: var(--lane); }
    .rule { stroke: var(--rule); } .chip { fill: var(--chip); } .chip-focal { fill: var(--focal-chip); }
    .node { fill: var(--node-fill); stroke: var(--node-stroke); }
    .node-focal { fill: var(--focal-fill); stroke: var(--accent); }
    .a-muted { stroke: var(--muted); } .a-accent { stroke: var(--accent); } .a-link { stroke: var(--link); }
    .m-muted { fill: var(--muted); } .m-accent { fill: var(--accent); } .m-link { fill: var(--link); }
    .mask { fill: var(--paper); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · SDLC fondé sur l’IA, version git</p>
    <h1>Qui fait quoi, et quel artefact passe de main en main</h1>

    <div class="scroll">
    <svg viewBox="0 0 840 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-sdlc-data-flow-title git-sdlc-data-flow-desc">
      <title id="git-sdlc-data-flow-title">Qui fait quoi dans le SDLC git</title>
      <desc id="git-sdlc-data-flow-desc">L’initiateur rédige l’intent avec Claude et le product owner fusionne les PR d’intent et de spec ; l’ingénierie planifie, code et teste sur la PR build, que le tech lead revoit selon REVIEW.md et fusionne par rebase ; le release manager publie une release GitHub sur un tag YY.MM.DD, et un incident en production ouvre un nouvel intent avec Parent.</desc>
      <defs>
        <pattern id="git-sdlc-df-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)" class="dot"/></pattern>
        <marker id="git-sdlc-df-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75" class="m-muted"/></marker>
        <marker id="git-sdlc-df-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520" class="m-accent"/></marker>
        <marker id="git-sdlc-df-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8" class="m-link"/></marker>
      </defs>
      <rect width="840" height="436" fill="#f5f5f5" class="bg"/>
      <rect width="840" height="436" fill="url(#git-sdlc-df-dots)"/>
      <rect x="0" y="36" width="840" height="80" fill="rgba(45,49,66,0.018)" class="lane"/>
      <rect x="0" y="196" width="840" height="80" fill="rgba(45,49,66,0.018)" class="lane"/>

      <!-- En-tête et couloirs -->
      <g stroke="rgba(45,49,66,0.12)" stroke-width="0.8" class="rule">
        <line x1="0" y1="36" x2="840" y2="36"/>
        <line x1="0" y1="116" x2="840" y2="116"/>
        <line x1="0" y1="196" x2="840" y2="196"/>
        <line x1="0" y1="276" x2="840" y2="276"/>
        <line x1="0" y1="356" x2="840" y2="356"/>
        <line x1="140" y1="36" x2="140" y2="356"/>
      </g>

      <g aria-label="Étapes du SDLC">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)" class="chip"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">PLAN</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)" class="chip"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">DESIGN</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(191,69,32,0.20)" class="chip-focal"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">BUILD</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)" class="chip"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">TEST</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)" class="chip"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">DEPLOY</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)" class="chip"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">MAINTAIN</text>
      </g>

      <g aria-label="Rôles">
        <text x="70" y="72" class="lane-label">PRODUIT</text><text x="70" y="84" class="lane-label">INITIATEUR · PO</text>
        <text x="70" y="152" class="lane-label">INGÉNIERIE</text><text x="70" y="164" class="lane-label">DEV + CLAUDE</text>
        <text x="70" y="232" class="lane-label">REVUE</text><text x="70" y="244" class="lane-label">TECH LEAD</text>
        <text x="70" y="312" class="lane-label">RELEASE</text><text x="70" y="324" class="lane-label">OPS · RM</text>
      </g>

      <!-- Connecteurs d’abord ; coudes orthogonaux r=8. -->
      <path d="M246 76 H258" fill="none" stroke="#4f5d75" class="a-muted" marker-end="url(#git-sdlc-df-arr-muted)"/>
      <path d="M358 76 H412 Q420 76 420 84 V124" fill="none" stroke="#bf4520" stroke-width="1.2" class="a-accent" marker-end="url(#git-sdlc-df-arr-accent)"/>

      <path d="M644 268 V284" fill="none" stroke="#4f5d75" class="a-muted" marker-end="url(#git-sdlc-df-arr-muted)"/>

      <rect x="368" y="56" width="44" height="12" rx="2" fill="#f5f5f5" class="mask"/>
      <text x="390" y="65" class="arrow-label">SPEC.MD</text>

      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)" class="chip"/><text x="159" y="55" class="role-text">INI</text>
      <text x="196" y="67" class="node-title">Rédiger l’intent</text><text x="196" y="79" class="node-sub">need/&lt;id&gt;/intent</text><text x="196" y="91" class="node-tool">skill redaction-intent</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="234" y="104" class="chip-text">IN</text>

      <rect x="258" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" class="node"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)" class="chip"/><text x="271" y="55" class="role-text">PO</text>
      <text x="308" y="67" class="node-title">Valider la spec</text><text x="308" y="79" class="node-sub">need/&lt;id&gt;/spec</text><text x="308" y="91" class="node-tool">git sdlc merge · PO</text>
      <rect x="262" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="270" y="104" class="chip-text">IN</text>

      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(191,69,32,0.20)" class="chip-focal"/><text x="383" y="135" class="role-text focal-text">DEV</text>
      <text x="420" y="147" class="node-title">Plan &amp; code</text><text x="420" y="159" class="node-sub">need/&lt;id&gt;/build</text><text x="420" y="171" class="node-tool">plan mode · plan.md</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">SP</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">CD</text>

      <!-- DEV : Tests -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" class="node"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)" class="chip"/><text x="495" y="135" class="role-text">DEV</text>
      <text x="532" y="147" class="node-title">Tests en boucle</text><text x="532" y="159" class="node-sub">tests + recette</text><text x="532" y="171" class="node-tool">check sdlc-conventions</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="184" class="chip-text">CD</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#4a7c59"/><text x="570" y="184" class="chip-text">PR</text>

      <!-- TL : Revue & merge -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" class="node"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)" class="chip"/><text x="607" y="215" class="role-text">TL</text>

      <rect x="598" y="258" width="16" height="8" rx="3" fill="#4a7c59"/><text x="606" y="264" class="chip-text">PR</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="682" y="264" class="chip-text">CD</text>

      <!-- OPS : Tag de release -->
      <rect x="594" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)" class="node"/>
      <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)" class="chip"/><text x="607" y="295" class="role-text">RM</text>

      <rect x="260" y="366" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)" class="chip"/><text x="272" y="374" class="step-number">02</text><text x="290" y="375" class="legend-text">Design</text>
      <rect x="348" y="366" width="24" height="12" rx="6" fill="rgba(191,69,32,0.20)" class="chip-focal"/><text x="360" y="374" class="step-number focal-text">03</text><text x="378" y="375" class="legend-text">Build</text>
      <rect x="428" y="366" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)" class="chip"/><text x="440" y="374" class="step-number">04</text><text x="458" y="375" class="legend-text">Test</text>
      <rect x="504" y="366" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)" class="chip"/><text x="516" y="374" class="step-number">05</text><text x="534" y="375" class="legend-text">Deploy</text>

      <!-- Légende : artefacts -->

    </div>
  </main>
</body>
</html>
