<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cycle de vie d’un besoin dans git · Machine à états</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --paper:#f5f5f5; --node:#ffffff; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580;
      --accent:#bf4520; --accent-tint:rgba(191,69,32,0.08);
      --band:rgba(79,93,117,0.035); --term:rgba(45,49,66,0.04); --rule:rgba(45,49,66,0.12);
      --tag:rgba(79,93,117,0.45); --dot:rgba(45,49,66,0.10);
      --font-sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
      --font-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
      --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper:#2d3142; --node:#393e53; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#949eb2;
        --accent:#f08a59; --accent-tint:rgba(240,138,89,0.10);
        --band:rgba(245,245,245,0.035); --term:rgba(245,245,245,0.04); --rule:rgba(245,245,245,0.12);
        --tag:rgba(191,192,192,0.50); --dot:rgba(245,245,245,0.10);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper:#2d3142; --node:#393e53; --ink:#f5f5f5; --muted:#bfc0c0; --soft:#949eb2;
      --accent:#f08a59; --accent-tint:rgba(240,138,89,0.10);
      --band:rgba(245,245,245,0.035); --term:rgba(245,245,245,0.04); --rule:rgba(245,245,245,0.12);
      --tag:rgba(191,192,192,0.50); --dot:rgba(245,245,245,0.10);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 3rem 1.25rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; max-width: 100%; }
    svg { width: 100%; min-width: 1160px; display: block; }
    svg text { font-family: var(--font-sans); }

    /* Rôles de couleur : les attributs portent la valeur claire, ces classes suivent le thème. */
    .f-paper { fill: var(--paper); }   .f-node { fill: var(--node); }
    .f-tint { fill: var(--accent-tint); } .f-band { fill: var(--band); }
    .f-term { fill: var(--term); }     .f-ink { fill: var(--ink); }
    .f-muted { fill: var(--muted); }   .f-soft { fill: var(--soft); }
    .f-accent { fill: var(--accent); } .f-dot { fill: var(--dot); }
    .s-ink { stroke: var(--ink); }     .s-muted { stroke: var(--muted); }
    .s-accent { stroke: var(--accent); } .s-rule { stroke: var(--rule); }
    .s-tag { stroke: var(--tag); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">État · Lifecycle phase map</p>
    <h1>Cycle de vie d’un besoin dans git</h1>

    <div class="scroll">
    <svg viewBox="0 0 1160 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="git-sdlc-states-title git-sdlc-states-desc">
      <title id="git-sdlc-states-title">Cycle de vie d’un besoin dans git</title>
      <desc id="git-sdlc-states-desc">Un besoin passe par cinq phases (intent, spec, build et tests, prêt à livrer, livré), chacune franchie par un événement git, avec deux états de reprise (corrections, incident) et une issue terminale (rejet).</desc>
      <defs>
        <pattern id="git-sdlc-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" class="f-dot"/></pattern>
        <marker id="git-sdlc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75" class="f-muted"/></marker>
        <marker id="git-sdlc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520" class="f-accent"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5" class="f-paper"/>
      <rect width="100%" height="100%" fill="url(#git-sdlc-dots)" opacity="0.55"/>

      <!-- Bandes : reprise en haut, issue terminale en bas. -->
      <rect x="16" y="24" width="1128" height="148" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)" class="f-band s-rule"/>
      <rect x="16" y="400" width="1128" height="116" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)" class="f-term s-rule"/>
      <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.14em" fill="#4f5d75" class="f-muted">
        <text x="32" y="40">REPRISE / BOUCLE</text>
        <text x="32" y="212">PHASES PRINCIPALES</text>
        <text x="32" y="420">ISSUE TERMINALE</text>
      </g>

      <!-- Dix transitions, dessinées avant les états. -->
      <g fill="none" stroke-width="1.2">
        <line x1="34" y1="264" x2="104" y2="264" stroke="#4f5d75" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="248" y1="264" x2="324" y2="264" stroke="#4f5d75" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="468" y1="264" x2="544" y2="264" stroke="#4f5d75" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="688" y1="264" x2="764" y2="264" stroke="#4f5d75" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="908" y1="264" x2="984" y2="264" stroke="#bf4520" stroke-width="1.4" class="s-accent" marker-end="url(#git-sdlc-arrow-accent)"/>
        <line x1="592" y1="228" x2="592" y2="148" stroke="#4f5d75" stroke-dasharray="5,4" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="640" y1="148" x2="640" y2="228" stroke="#4f5d75" stroke-dasharray="5,4" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="1072" y1="228" x2="1072" y2="148" stroke="#4f5d75" stroke-dasharray="5,4" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <path d="M1040 76 V64 Q1040 56 1032 56 H184 Q176 56 176 64 V228" stroke="#4f5d75" stroke-dasharray="5,4" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
        <line x1="176" y1="300" x2="176" y2="432" stroke="#4f5d75" class="s-muted" marker-end="url(#git-sdlc-arrow)"/>
      </g>

      <!-- Masques opaques : chaque libellé garde un écart visible avec son trait. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75" class="f-muted">
        <rect x="48" y="244" width="42" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="69" y="253">BESOIN</text>
        <rect x="254" y="244" width="64" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="286" y="253">MERGE INTENT</text>
        <rect x="476" y="244" width="60" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="506" y="253">MERGE SPEC</text>
        <rect x="694" y="244" width="64" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="726" y="253">MERGE BUILD</text>
        <rect x="914" y="244" width="64" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="946" y="253" fill="#bf4520" class="f-accent">TAG RELEASE</text>
        <rect x="532" y="182" width="52" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="558" y="191">CONSTATS</text>
        <rect x="648" y="182" width="56" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="676" y="191">CORRECTIF</text>
        <rect x="986" y="182" width="78" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="1025" y="191">BANDE FRANCHIE</text>
        <rect x="572" y="36" width="76" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="610" y="45">NOUVEL INTENT</text>
        <rect x="184" y="356" width="48" height="12" rx="2" fill="#f5f5f5" class="f-paper"/><text x="208" y="365">REFUS PO</text>
      </g>

      <circle cx="28" cy="264" r="6" fill="#2d3142" class="f-ink"/>

      <!-- Rail principal : cinq phases (tag = étape du SDLC, sous-libellé = qui · trace git). -->
      <g text-anchor="middle">
        <g>
          <rect x="104" y="228" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" class="f-node s-ink"/>
          <rect x="114" y="238" width="32" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="130" y="247" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">PLAN</text>
          <text x="176" y="270" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Intent en cours</text>
          <text x="176" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">PO · need/&lt;id&gt;/intent</text>
        </g>
        <g>
          <rect x="324" y="228" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" class="f-node s-ink"/>
          <rect x="334" y="238" width="40" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="354" y="247" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">DESIGN</text>
          <text x="396" y="270" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Spec en cours</text>
          <text x="396" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">PO · need/&lt;id&gt;/spec</text>
        </g>
        <g>
          <rect x="544" y="228" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" class="f-node s-ink"/>
          <rect x="554" y="238" width="68" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="588" y="247" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">BUILD · TEST</text>
          <text x="616" y="270" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Plan, code, tests</text>
          <text x="616" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">Dev · need/&lt;id&gt;/build</text>
        </g>
        <g>
          <rect x="764" y="228" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" class="f-node s-ink"/>
          <rect x="774" y="238" width="40" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="794" y="247" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">DEPLOY</text>
          <text x="836" y="270" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Prêt à livrer</text>
          <text x="836" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">main · Stage: build</text>
        </g>
        <g>
          <rect x="984" y="228" width="144" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" class="f-tint s-accent"/>
          <rect x="994" y="238" width="40" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="1014" y="247" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">DEPLOY</text>
          <circle cx="1108" cy="244" r="7" fill="none" stroke="#bf4520" class="s-accent"/>
          <circle cx="1108" cy="244" r="4" fill="#bf4520" class="f-accent"/>
          <text x="1056" y="270" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Livré</text>
          <text x="1056" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">RM · tag release/*</text>
        </g>
      </g>

      <!-- États de reprise. -->
      <g text-anchor="middle">
        <g>
          <rect x="544" y="76" width="144" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4" class="f-paper s-muted"/>
          <rect x="554" y="86" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="576" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">REPRISE</text>
          <text x="616" y="118" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Corrections</text>
          <text x="616" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">git notes --ref=review</text>
        </g>
        <g>
          <rect x="984" y="76" width="144" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4" class="f-paper s-muted"/>
          <rect x="994" y="86" width="50" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
          <text x="1019" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">MAINTAIN</text>
          <text x="1056" y="118" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Incident</text>
          <text x="1056" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">intent.md · Parent: &lt;id&gt;</text>
        </g>
      </g>

      <!-- Issue terminale. -->
      <g text-anchor="middle">
        <rect x="104" y="432" width="144" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3" class="f-term s-muted"/>
        <rect x="114" y="442" width="50" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)" class="s-tag"/>
        <text x="139" y="451" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" class="f-muted">TERMINAL</text>
        <text x="176" y="474" fill="#2d3142" font-size="12" font-weight="600" class="f-ink">Rejeté</text>
        <text x="176" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" class="f-muted">branche non fusionnée</text>
      </g>

      <!-- Annotation éditoriale. -->
      <g font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" fill="#4f5d75" class="f-muted">
        <text x="280" y="462">Un refus peut survenir à chaque gate, avant merge :</text>
        <text x="280" y="482">la branche est supprimée et rien n’atteint main.</text>
      </g>

      <!-- Légende : bande horizontale en bas. -->
      <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" class="f-muted">
        <line x1="32" y1="548" x2="64" y2="548" stroke="#4f5d75" stroke-width="1.2" class="s-muted"/>
        <text x="72" y="551">gate · merge -S + Approved-by</text>
        <line x1="332" y1="548" x2="364" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" class="s-muted"/>
        <text x="372" y="551">reprise / boucle</text>
        <line x1="532" y1="548" x2="564" y2="548" stroke="#bf4520" stroke-width="1.4" class="s-accent"/>
        <text x="572" y="551">autorisation de mise en prod (release manager)</text>
      </g>
    </svg>
    </div>
  </div>
</body>
</html>
